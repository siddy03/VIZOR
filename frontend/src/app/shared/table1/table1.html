<div class="card" role="region" [attr.aria-label]="emptyTitle ? 'Data table' : null">
    <p-table [value]="rows" [tableStyle]="{ 'min-width': '50rem' }" aria-label="Data table" [dataKey]="dataKey"
        [paginator]="paginator" [rows]="rowsPerPage" [rowsPerPageOptions]="rowsPerPageOptions"
        currentPageReportTemplate="Showing {first} to {last} of {totalRecords} entries" [showCurrentPageReport]="paginator">
        <ng-template pTemplate="header">
            <tr>
                <th *ngIf="expandableRows" style="width: 3rem" scope="col">
                    <span class="sr-only">Expand row</span>
                </th>
                <th *ngFor="let col of columns" scope="col" [pSortableColumn]="col.sortable ? col.field : undefined"
                    class="text-900 text-sm font-semibold whitespace-nowrap">
                    {{ col.header }}
                    <p-sortIcon *ngIf="col.sortable" [field]="col.field"></p-sortIcon>
                </th>
                <th *ngIf="showEditAction || showDeleteAction || rowActions.length > 0" class="w-8rem text-center" scope="col">
                    <span class="sr-only">Actions</span>
                </th>
            </tr>
        </ng-template>
        
        <ng-template pTemplate="body" let-row let-expanded="expanded">
            <tr>
                <td *ngIf="expandableRows">
                    <button type="button" pButton pRipple [pRowToggler]="row"
                        class="p-button-text p-button-rounded p-button-plain"
                        [icon]="expanded ? 'pi pi-chevron-down' : 'pi pi-chevron-right'">
                    </button>
                </td>
                
                <td *ngFor="let col of columns" class="text-600 text-sm font-normal">
                    <ng-container [ngSwitch]="col.type || 'text'">
                        <ng-container *ngSwitchCase="'checkbox'">
                            <p-checkbox
                                [binary]="true"
                                [inputId]="'cb-' + col.field + '-' + (row[dataKey] ?? '')"
                                [ngModel]="getCheckboxValue(row, col.field)"
                                [disabled]="isCellDisabled(row, col.field)"
                                [attr.aria-label]="col.header + ' for row'"
                                (ngModelChange)="onCheckboxModelChange(row, col.field, $event)">
                            </p-checkbox>
                        </ng-container>
                        <ng-container *ngSwitchCase="'status'">
                            <span class="status-text" [attr.aria-label]="'Status: ' + row[col.field]">
                                {{ row[col.field] }}
                            </span>
                        </ng-container>
                        <ng-container *ngSwitchDefault>
                            {{ getTextValue(row, col.field) }}
                        </ng-container>
                    </ng-container>
                </td>
                
                <td *ngIf="showEditAction || showDeleteAction || rowActions.length > 0" class="text-center">
                    <div class="row-actions" role="group" aria-label="Row actions">
                        <!-- Dynamic Actions -->
                        <button *ngFor="let action of rowActions"
                            type="button" pButton
                            [icon]="action.icon"
                            [title]="action.title || action.tooltip"
                            class="p-button-text p-button-rounded action-btn {{ action.cssClass || '' }}"
                            [attr.aria-label]="action.tooltip"
                            (click)="onActionClick(action.id, row)">
                        </button>

                        <!-- Legacy Edit Action -->
                        <button *ngIf="showEditAction"
                            type="button" pButton icon="icon-edit-svg"
                            class="p-button-text p-button-rounded p-button-plain table1-edit-btn"
                            [attr.aria-label]="editAriaLabel"
                            (click)="onEditClick(row)">
                        </button>

                        <!-- Delete Action (matches table2) -->
                        <button *ngIf="showDeleteAction"
                            type="button" pButton icon="pi pi-trash"
                            class="p-button-text p-button-rounded p-button-plain action-btn delete-btn"
                            title="Delete"
                            [attr.aria-label]="deleteAriaLabel"
                            (click)="onDeleteClick(row)">
                        </button>
                    </div>
                </td>
            </tr>
        </ng-template>

        <!-- Dynamic Row Expansion Template -->
        <ng-template pTemplate="rowexpansion" let-row *ngIf="expandableRows">
            <ng-container *ngTemplateOutlet="rowExpansionTemplate; context: {$implicit: row}"></ng-container>
        </ng-template>

        <ng-template pTemplate="emptymessage">
            <tr>
                <td [attr.colspan]="columns.length + (showEditAction || showDeleteAction || rowActions.length > 0 ? 1 : 0) + (expandableRows ? 1 : 0)" class="text-center p-5 border-none">
                    <div class="table1-empty-state" role="status" aria-live="polite">
                        <img src="/assets/no-records.png" alt="" aria-hidden="true" />
                        <span>{{ emptyTitle }}</span>
                    </div>
                </td>
            </tr>
        </ng-template>
    </p-table>
</div>
