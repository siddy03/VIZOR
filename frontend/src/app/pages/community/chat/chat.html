<section class="panel-host" aria-label="Community chat">
  <div class="panel-header">
    <span class="ws-status" [attr.data-status]="status()" aria-live="polite">
      <span class="ws-dot"></span>
      {{ status() === 'open' ? 'Live' : status() === 'connecting' ? 'Connecting...' : 'Offline' }}
    </span>
    <div class="participants-badge" role="status"
         [attr.aria-label]="'Participants: ' + participants()">
      <i class="pi pi-users" aria-hidden="true"></i>
      <span>Participants ({{ participants() }})</span>
    </div>
  </div>

  <div class="tab-panel" role="tabpanel" tabindex="0">
    <div *ngIf="messages().length === 0" class="empty-state" role="status">
      <i class="pi pi-comment" style="font-size: 3rem; color: #dee2e6;" aria-hidden="true"></i>
      <p>No messages yet. Start chatting!</p>
      <p class="chat-username-hint">You are <strong>{{ senderName }}</strong></p>
    </div>

    <div *ngIf="messages().length > 0" class="message-list" #chatMessageList>
      <div *ngFor="let m of messages(); trackBy: trackById"
           class="message-bubble"
           [class.from-me]="isMine(m)"
           [class.from-server]="!isMine(m)">
        <div class="message-meta">
          <span class="message-sender">{{ isMine(m) ? 'You' : m.senderName }}</span>
          <span class="message-time">{{ m.timestamp | date:'shortTime' }}</span>
        </div>
        <div class="message-text">{{ m.text }}</div>
      </div>
    </div>
  </div>

  <div class="message-input-section" role="form" aria-label="Send a chat message">
    <p-inputGroup styleClass="message-input-group">
      <label for="chat-message-input" class="sr-only">Chat message</label>
      <input id="chat-message-input"
             type="text"
             pInputText
             [placeholder]="'Send a message as ' + senderName"
             class="message-input"
             aria-label="Type a chat message"
             [(ngModel)]="draft"
             [disabled]="status() !== 'open'"
             (keyup.enter)="sendMessage()" />
      <p-button icon="pi pi-send"
                styleClass="send-button"
                [rounded]="true"
                [disabled]="!draft.trim() || status() !== 'open'"
                (onClick)="sendMessage()"
                [attr.aria-label]="'Send chat message'">
      </p-button>
    </p-inputGroup>
  </div>
</section>
