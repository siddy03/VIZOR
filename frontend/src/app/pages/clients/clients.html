<main class="projects-page-container" aria-labelledby="page-heading" aria-label="Clients management">
    <!-- Skip to main content link for keyboard users -->
    <a class="skip-link" href="#clients-table">Skip to clients table</a>

    <!-- Breadcrumb + Add Button Row -->
    <div class="top-row">
        <app-breadcrumb [items]="breadcrumbItems" class="inline-breadcrumb"></app-breadcrumb>
        <button pButton type="button" label="Add New Client" class="p-button-primary add-btn-custom"
            aria-label="Add new client"
            (click)="navigateToAddClient()"></button>
    </div>

    <!-- Filters (3-column grid) -->
    <section class="filter-bar" role="search" aria-label="Client filters">
        <!-- Status Dropdown -->
        <div class="filter-item status-filter">
            <app-shared-dropdown
                label="Status"
                [options]="statusOptions"
                [value]="selectedStatus()"
                (valueChange)="selectedStatus.set($event)"
                optionLabel="label"
                placeholder="Active">
            </app-shared-dropdown>
        </div>

        <!-- Parent Client Dropdown -->
        <div class="filter-item parent-client-filter">
            <app-shared-dropdown
                label="Parent Client"
                [options]="parentClientOptions()"
                [value]="selectedParentClient()"
                (valueChange)="selectedParentClient.set($event)"
                optionLabel="label"
                placeholder="All">
            </app-shared-dropdown>
        </div>

        <!-- Search Bar -->
        <div class="filter-item search-filter">
            <app-shared-searchbar
                placeholder="Search"
                ariaLabel="Search clients"
                id="clients-search"
                [value]="searchTerm()"
                (valueChange)="searchTerm.set($event)">
            </app-shared-searchbar>
        </div>
    </section>

    <!-- Table -->
    <section id="clients-table" aria-label="Clients data table" tabindex="-1">
        <app-table1
            [rows]="filteredClients()"
            [columns]="clientColumns"
            [rowActions]="clientActions"
            [paginator]="true"
            [rowsPerPage]="10"
            (actionClick)="onActionClick($event)">
        </app-table1>
    </section>
</main>
