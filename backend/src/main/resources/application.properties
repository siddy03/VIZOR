# =============================================
# VIZOR Backend - Application Properties
# =============================================

# Server Port
server.port=8080

# MySQL Database Configuration
# Override via environment variables: MYSQL_HOST, MYSQL_PORT, MYSQL_DB, MYSQL_USER, MYSQL_PASSWORD
spring.datasource.url=jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DB:vizor_db}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
spring.datasource.username=${MYSQL_USER:root}
spring.datasource.password=${MYSQL_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# JWT Configuration
app.jwt.secret=${JWT_SECRET:change-me-in-local-dev}
# Short-lived access token (15 minutes) and long-lived refresh token (7 days)
app.jwt.access-expiration-ms=900000
app.jwt.refresh-expiration-ms=604800000

# Auth Cookie Configuration
# secure=true requires HTTPS; keep false for local http dev, set true in production.
app.cookie.secure=false
# SameSite: Lax | Strict | None  (None requires secure=true)
app.cookie.same-site=Lax

# Socket.IO Server (Community -> Chat tab)
# Runs as a standalone Netty server alongside Tomcat on a different port.
socketio.host=0.0.0.0
socketio.port=9092
socketio.allowed-origin=http://localhost:4200

# Logging
logging.level.com.vizor=DEBUG
