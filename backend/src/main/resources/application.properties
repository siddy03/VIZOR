# =============================================
# VIZOR Backend - Application Properties
# =============================================

# Server Port
server.port=8080

# In-Memory H2 Database Configuration
spring.datasource.url=jdbc:h2:file:./data/vizor_db;AUTO_SERVER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# H2 Console GUI Config (optional: helps you visibly see your db!)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# JWT Configuration
app.jwt.secret=VizorSecretKey2026SuperSecureRandomStringThatIs256BitsLongForHS256Algorithm!!
app.jwt.expiration-ms=86400000

# Logging
logging.level.com.vizor=DEBUG
